# Pass 2a (paper Table 4): ENGLISH exemplars. Only en_cot is defined (native_cot is N/A);
# English items are skipped because that prompt is identical to pass 1.
# max_new_tokens raised to 768 after the 0.6B run truncated 85% of Telugu and 59% of
# Bengali NATIVE-COT completions at 256 (those scripts cost 3-6x the tokens of English).
name: qwen3_0.6b_base_pass2_english
model: Qwen/Qwen3-0.6B-Base
backend: vllm
dtype: float16
max_new_tokens: 768
batch_size: 250

languages: [de, fr, es, ru, zh, ja, th, te, bn, sw]
cells: [en_cot]
exemplar_set: english
n_shot: 6
n_items: null
output: results/kaggle/qwen3_0.6b_base_pass2_english.jsonl
